name: Public release verification
'on':
  push:
    tags:
      - v*
  workflow_dispatch: {}
jobs:
  build-test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Require the release tag from main
        run: |
          set -euo pipefail
          git fetch --no-tags origin main:refs/remotes/origin/main
          [[ "$GITHUB_REF" == refs/tags/v* ]] || { echo '::error::Use the release tag gate.'; exit 1; }
          git merge-base --is-ancestor HEAD origin/main || { echo '::error::Tag must belong to main.'; exit 1; }
      - name: Test runtime release observation
        run: python3 -m unittest discover -s scripts/workspace -p test_wait_for_runtime_release.py
      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Normalize wrapper properties EOL
        run: sed -i 's/\r$//' .mvn/wrapper/maven-wrapper.properties
      - name: Make mvnw executable
        run: chmod +x mvnw
      - name: Validate shell scripts
        shell: bash
        run: |
          set -euo pipefail
          bash -n scripts/*.sh
      - name: Require published starter dependencies before the release build
        shell: bash
        run: |
          set -euo pipefail

          read_property() {
            local property="$1"
            python3 - "$property" <<'PY'
          import sys
          import xml.etree.ElementTree as ET

          property_name = sys.argv[1]
          namespace = {"m": "http://maven.apache.org/POM/4.0.0"}
          root = ET.parse("pom.xml").getroot()
          properties = root.find("m:properties", namespace)
          value = properties.findtext(f"m:{property_name}", namespaces=namespace) if properties is not None else None
          if not value:
              raise SystemExit(f"Could not read property {property_name} from pom.xml")
          print(value.strip())
          PY
          }

          artifact_url() {
            local artifact="$1"
            local version="$2"
            echo "https://repo.maven.apache.org/maven2/io/github/codexrodrigues/${artifact}/${version}/${artifact}-${version}.pom"
          }

          wait_for_artifact() {
            local artifact="$1"
            local version="$2"
            local url
            url="$(artifact_url "$artifact" "$version")"

            status="$(curl -L -s -o /dev/null -w '%{http_code}' --connect-timeout 10 --max-time 30 "$url" || true)"
            [[ "$status" == 200 ]] || { echo "::error::${artifact}:${version} is not available (HTTP $status). Confirm dependency publication locally before retrying this release gate."; return 1; }

          }

          wait_for_artifact "praxis-metadata-starter" "$(read_property praxis.core.version)"
          wait_for_artifact "praxis-config-starter" "$(read_property praxis.config.version)"
      - name: Maven Verify (com testes)
        run: ./mvnw -B -fae -Dstyle.color=always verify
      - name: Verify packaged runtime dependencies
        run: bash scripts/verify-packaged-runtime.sh
      - name: Test Summary
        if: always()
        run: |
          echo '### Test Results' >> $GITHUB_STEP_SUMMARY
          grep -R "<testsuite" -n target/surefire-reports || true
    timeout-minutes: 30
permissions:
  contents: read
concurrency:
  group: public-release-verification-${{ github.ref }}
  cancel-in-progress: true
